name: supabase-keepalive

# The free plan pauses a Supabase project after 7 days without activity (step 5 plan §7). Once a day, one tiny read
# through production's health route, which needs no secrets: the route uses the server's own key and returns { ok }.
# GitHub turns off a public repo's scheduled workflows after 60 days without repository activity; if this one stops
# and the project pauses, restore the project in Supabase's dashboard and re-enable this workflow under Actions.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl --fail --silent --show-error --retry 3 --retry-delay 30 https://parcelscreen.vercel.app/api/health
