name: Public lands probe

# Roadmap step 16 (docs/plans/step-16-public-lands.md): the cloud sessions that build the app can't reach PAD-US's or
# the Forest Service's hosts; CI's runners can. This records the services' descriptions and a few records for the plan,
# to the pr-assets branch (pr-assets/step-16/probe/). Nothing here gates a merge.
on:
  pull_request:
    paths:
      - scripts/probe-public-lands.mjs
      - .github/workflows/public-lands.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A fork's PR gets a read-only token: nothing to push to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/probe-public-lands.mjs out/probe
        continue-on-error: true
        timeout-minutes: 6
      - name: To pr-assets/step-16/probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pr-assets
          git worktree add ../assets origin/pr-assets
          rm -rf ../assets/step-16/probe
          mkdir -p ../assets/step-16
          cp -r out/probe ../assets/step-16/probe
          cd ../assets
          git add step-16
          git commit -m "Step 16 probe (${GITHUB_SHA::7})" || exit 0
          git push origin HEAD:pr-assets
