name: Mapterhorn extract sizes

# Roadmap step 14c (owner, 10/25): what a self-hosted Mapterhorn extract of our region would weigh, read from its own
# PMTiles archives without downloading them (pmtiles extract --dry-run reads only the directories). Printed to the log
# and the job summary. Nothing here gates a merge.
on:
  pull_request:
    paths:
      - .github/workflows/mapterhorn-extract.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Mapterhorn extract sizes
        run: |
          url=$(curl -sSL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | grep -o 'https://[^"]*Linux_x86_64.tar.gz' | head -1)
          curl -sSL "$url" | tar xz pmtiles
          curl -sSL https://download.mapterhorn.com/download_urls.json -o urls.json
          {
            echo "## Mapterhorn extracts, sized with pmtiles --dry-run"
            echo
            for box in "-90.4,33.8,-75.2,39.5 VA+NC+TN" "-83.8,34.9,-78.6,38.6 the-area-catalog's-mountains"; do
              set -- $box
              export BOX="$1"
              echo "### $2 ($1)"
              echo '```'
              ./pmtiles extract --dry-run --bbox="$1" https://download.mapterhorn.com/planet.pmtiles /tmp/planet.pmtiles 2>&1 | tail -4
              # The z13+ archives (one per zoom-6 tile, named z-x-y) whose bounds meet the box.
              node -e '
                const [w, s, e, n] = process.env.BOX.split(",").map(Number);
                for (const f of require("./urls.json").items)
                  if (f.name !== "planet.pmtiles" && f.max_lon > w && f.min_lon < e && f.max_lat > s && f.min_lat < n)
                    console.log(`${f.url} ${f.size} z${f.min_zoom}-${f.max_zoom}`);
              ' | sort -u > hits.txt
              echo "z13+ archives intersecting: $(wc -l < hits.txt)"
              while read -r u size zooms; do
                echo "$(basename "$u") ($zooms, whole archive $((size / 1000000)) MB): $(./pmtiles extract --dry-run --bbox="$1" "$u" /tmp/x.pmtiles 2>&1 | tail -1)"
              done < hits.txt
              echo '```'
            done
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
