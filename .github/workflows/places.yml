name: Places

# Roadmap step 14d (docs/plans/step-14d-places.md §7): the network work this repo's cloud sessions can't do, run on
# GitHub's runners for a PR that asks for it in .github/places-run.json. Jobs:
# - bake: `pnpm data:places`, the baked places under public/places/v1/;
# - record: `pnpm record:port` for each fixture (Mud Creek append-only, its guard's rule; or only the request's
#   `append` fixtures, append-only), the fixtures' recordings
#   of what a grade asks live (their places come from their frozen copies, test/fixtures/<slug>/places/), and
#   `pnpm areas:record`, the recorded area profile's (its places from test/fixtures/areas/<id>/places/);
# - timing: `pnpm grade:timing` on main, then on the PR's branch, into the job summary (nothing pushed);
# - areas: `pnpm areas:record`, the recorded area profile only, and `pnpm areas:profile`, every area file
#   (public/areas/v<n>/, the previous version's area files removed: a format change is a clean break). No fixture
#   recording moves.
# Each finished request is recorded in .github/places-done.json and pushed with the job's output to the PR's branch,
# so a later push to the PR doesn't run it again. A push made with GITHUB_TOKEN starts no workflow, so the job then
# dispatches ci.yml on the branch (as areas-refresh.yml does); its checks land on the commit, so the PR shows them.
on:
  pull_request:
    paths:
      - .github/places-run.json

concurrency:
  group: places-${{ github.head_ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  ask:
    # A fork's PR gets a read-only token: nothing to push to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      request: ${{ steps.read.outputs.request }}
      bake: ${{ steps.read.outputs.bake }}
      record: ${{ steps.read.outputs.record }}
      timing: ${{ steps.read.outputs.timing }}
      areas: ${{ steps.read.outputs.areas }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - id: read
        run: |
          request=$(node -p "require('./.github/places-run.json').request")
          done=$(node -p "try { require('./.github/places-done.json').request } catch { '' }")
          echo "request=$request" >> "$GITHUB_OUTPUT"
          for job in bake record timing areas; do
            if [ "$request" = "$done" ]; then
              echo "$job=false" >> "$GITHUB_OUTPUT"
            else
              echo "$job=$(node -p "require('./.github/places-run.json').jobs.includes('$job')")" >> "$GITHUB_OUTPUT"
            fi
          done
          [ "$request" = "$done" ] && echo "Request $request already ran." || true

  bake:
    needs: ask
    if: needs.ask.outputs.bake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:places
      - name: Push the bake to the PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ needs.ask.outputs.request }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "require('fs').writeFileSync('.github/places-done.json', JSON.stringify({ request: process.env.REQUEST, ran: new Date().toISOString() }, null, 2) + '\n')"
          git add public/places .github/places-done.json
          git commit -m "Places bake ($REQUEST)" -m "$(node -p "const i = require('./public/places/v1/index.json'); i.sources.map(s => s.id + ': ' + s.count + ' (fetched ' + s.fetched + ')').join('\n')")"
          # The branch may have moved during the bake's hour or two.
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
          gh workflow run ci.yml --ref "${{ github.head_ref }}"

  record:
    needs: ask
    if: needs.ask.outputs.record == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Re-record the fixtures (Mud Creek append-only) and the recorded area profile
        run: |
          # A request may name fixtures to append to only ("append": [slugs]): their missing requests recorded, every
          # entry already there kept, nothing else re-recorded (#350: Ferney's new launch drives).
          append=$(node -p "(require('./.github/places-run.json').append ?? []).join(' ')")
          if [ -n "$append" ]; then
            for slug in $append; do PORT_APPEND="$slug" pnpm record:port; done
            exit 0
          fi
          for slug in ferney-creek-52-47A macks-mountain-35-3 roan-hwy-143-099-046-02; do
            pnpm record:port -t "$slug"
          done
          PORT_APPEND=grayson-mud-creek-6273 pnpm record:port
          # Roan's re-record drops the map search's region-wide ask, which this tool appends (UX part 2 PR 4).
          node test/tools/record-region-search.mts
          pnpm areas:record
      - name: Push the recordings to the PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ needs.ask.outputs.request }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "require('fs').writeFileSync('.github/places-done.json', JSON.stringify({ request: process.env.REQUEST, ran: new Date().toISOString() }, null, 2) + '\n')"
          git add test/fixtures .github/places-done.json
          git commit -m "Re-recorded the fixtures ($REQUEST)" || exit 0
          # Committed first: a rebase needs a clean tree, and the branch may have moved while the job ran.
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
          gh workflow run ci.yml --ref "${{ github.head_ref }}"

  timing:
    needs: ask
    if: needs.ask.outputs.timing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Before, on main (Photon, Overpass and the official services)
        run: |
          git fetch origin main
          git worktree add ../main origin/main
          cp test/tools/grade-timing.test.ts ../main/test/tools/
          cd ../main
          pnpm install --frozen-lockfile
          TIMING_LABEL="main: live places" pnpm exec vitest run test/tools/grade-timing.test.ts --mode grade-timing || true
          cat test-results/grade-timing.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: After, on this branch (the baked places)
        run: |
          TIMING_LABEL="this branch: baked places" pnpm grade:timing || true
          cat test-results/grade-timing.md >> "$GITHUB_STEP_SUMMARY" || true

  areas:
    # After record when a request asks for both, so the two pushes don't race on places-done.json.
    needs: [ask, record]
    if: ${{ !cancelled() && needs.ask.outputs.areas == 'true' && needs.record.result != 'failure' }}
    runs-on: ubuntu-latest
    # About 40 minutes, most of it OSRM's one request a second (as areas-refresh.yml).
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The recorded area profile, then every area
        run: |
          pnpm areas:record
          pnpm areas:profile
      - name: Push the area files to the PR's branch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST: ${{ needs.ask.outputs.request }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e "require('fs').writeFileSync('.github/places-done.json', JSON.stringify({ request: process.env.REQUEST, ran: new Date().toISOString() }, null, 2) + '\n')"
          # The current version's folder, and the older versions' area files gone (their samples, a version of their
          # own, stay).
          v=$(node -p "require('fs').readFileSync('lib/areas/types.ts','utf8').match(/AREA_FILE_VERSION = (\\d+)/)[1]")
          for d in public/areas/v*/; do
            [ "$d" = "public/areas/v$v/" ] || git rm -q --ignore-unmatch "$d"*.json
          done
          git add public/areas test/fixtures/areas .github/places-done.json
          git commit -m "Area files profiled again ($REQUEST)" || exit 0
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
          gh workflow run ci.yml --ref "${{ github.head_ref }}"
