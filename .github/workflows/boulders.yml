name: Boulder potential

# The boulders mission (docs/plans/boulders.md), on CI's runners, since the cloud sessions that build the app can't
# reach 3DEP or NRCS:
# - record: Grayson Highlands' boulder field read live (`pnpm record:boulders`), when test/fixtures/boulders-grayson/
#   has no recording (delete it to record again), pushed to the PR's branch; what it found goes to the job summary.
#   lib/screen/boulders-grayson.test.ts then replays it in CI's unit tests.
# - area-shares: while any area file in public/areas/v<n>/ has no boulder share, `pnpm areas:boulders` fills each from
#   its own points (live from SDA, nothing else in the file moves), and `AREA_APPEND=1 pnpm areas:record` adds the
#   recorded Grayson Highlands profile's SDA answers to its recording; both pushed to the PR's branch.
# - screenshots: the hand-back's shots (screenshots/boulders.spec.ts), at 1280 and 375, with the live basemaps, pushed
#   to the pr-assets branch (pr-assets/boulders/).
# Nothing here gates a merge.
on:
  pull_request:
    paths:
      - lib/screen/boulders.ts
      - lib/areas/boulders.ts
      - test/tools/areas-boulders.test.ts
      - test/tools/record-boulders.test.ts
      - test/support/bouldersGrayson.ts
      - screenshots/boulders.spec.ts
      - .github/workflows/boulders.yml
  workflow_dispatch: {}

concurrency:
  group: boulders-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  record:
    # A fork's PR gets a read-only token: nothing to push to.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - id: has
        run: |
          if [ -f test/fixtures/boulders-grayson/network.har ]; then echo "har=true" >> "$GITHUB_OUTPUT"; else echo "har=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v6
        if: steps.has.outputs.har == 'false'
      - uses: actions/setup-node@v7
        if: steps.has.outputs.har == 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.has.outputs.har == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.has.outputs.har == 'false'
        run: pnpm record:boulders
      - name: The reading, into the job summary
        if: always() && steps.has.outputs.har == 'false'
        run: cat test-results/boulders-grayson.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Push the recording to the PR's branch
        # Whatever the reading found: the unit test judges it, and the thresholds can be tried on the recording.
        if: always() && steps.has.outputs.har == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f test/fixtures/boulders-grayson/network.har ] || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/fixtures/boulders-grayson
          git commit -m "Grayson Highlands' boulder field recorded (record:boulders)" || exit 0
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
          # A push made with GITHUB_TOKEN starts no workflow (places.yml).
          gh workflow run ci.yml --ref "${{ github.head_ref }}"

  area-shares:
    # A fork's PR gets a read-only token: nothing to push to.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - id: need
        run: |
          v=$(node -p "require('fs').readFileSync('lib/areas/types.ts','utf8').match(/AREA_FILE_VERSION = (\\d+)/)[1]")
          n=$(node -e "const fs=require('fs');const d='public/areas/v$v/';let n=0;try{for(const f of fs.readdirSync(d))if(f.endsWith('.json')&&f!=='index.json'){const j=JSON.parse(fs.readFileSync(d+f,'utf8'));if(!('boulderShare' in j)||j.boulderShare===null)n++}}catch{}console.log(n)")
          echo "missing=$n" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.need.outputs.missing != '0'
      - uses: actions/setup-node@v7
        if: steps.need.outputs.missing != '0'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.need.outputs.missing != '0'
        run: pnpm install --frozen-lockfile
      - name: Any area the last profile missed, profiled first
        if: steps.need.outputs.missing != '0'
        run: |
          v=$(node -p "require('fs').readFileSync('lib/areas/types.ts','utf8').match(/AREA_FILE_VERSION = (\\d+)/)[1]")
          ids=$(node -e "const fs=require('fs');const o=require('./lib/areas/data/outlines.json');console.log(o.features.map(f=>f.properties.id).filter(id=>!fs.existsSync('public/areas/v$v/'+id+'.json')).join(','))")
          if [ -n "$ids" ]; then AREAS="$ids" pnpm areas:profile; fi
      - if: steps.need.outputs.missing != '0'
        run: pnpm areas:boulders
      - if: steps.need.outputs.missing != '0'
        run: AREA_APPEND=1 pnpm areas:record
      - name: The shares, into the job summary
        if: always() && steps.need.outputs.missing != '0'
        run: cat test-results/areas-boulders.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Push the area files and the recording to the PR's branch
        if: steps.need.outputs.missing != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/areas test/fixtures/areas
          git commit -m "The area files' boulder share filled (areas:boulders)" || exit 0
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
          # A push made with GITHUB_TOKEN starts no workflow (places.yml).
          gh workflow run ci.yml --ref "${{ github.head_ref }}"

  screenshots:
    # A fork's PR gets a read-only token: nothing to push to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test -c playwright.screenshots.config.ts screenshots/boulders.spec.ts
        env:
          E2E_SKIP_BUILD: "1"
      - name: To pr-assets/boulders
        if: always()
        run: |
          ls test-results/screenshots/boulders || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pr-assets
          git worktree add ../assets origin/pr-assets
          mkdir -p ../assets/boulders
          cp test-results/screenshots/boulders/*.png ../assets/boulders/
          cd ../assets
          git add -A boulders
          git commit -m "Boulder potential screenshots (${GITHUB_SHA::7})" || exit 0
          # Other workflows push here too: take theirs and try again.
          for i in 1 2 3; do
            git push origin HEAD:pr-assets && exit 0
            git pull --rebase origin pr-assets
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: boulders-shots-test-results
          path: test-results/
          retention-days: 7
