name: Lidar terrain tiles

# Roadmap step 14c (docs/plans/step-14c-lidar-terrain.md §3): times USGS 3DEP's lidar tiles at zooms 13–17 in both
# styles, and takes the layer's screenshots with the live tiles, on a PR that changes the layer or these tools, or by
# hand. The cloud sessions that build the app can't reach USGS; CI's runners can. The timings go in the job summary;
# the screenshots go to the pr-assets branch (pr-assets/14c-lidar/) for the PR's description. Nothing here gates a merge.
on:
  pull_request:
    paths:
      - components/Map/lidarStyle.ts
      - test/tools/lidar-tiles.test.ts
      - screenshots/lidar.spec.ts
      - .github/workflows/lidar-tiles.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lidar:tiles
      - if: always()
        run: cat test-results/lidar-tiles.md >> "$GITHUB_STEP_SUMMARY" || true

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # A fork's PR gets a read-only token: nothing to push to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test -c playwright.screenshots.config.ts lidar
        env:
          E2E_SKIP_BUILD: "1"
      - name: To pr-assets/14c-lidar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pr-assets
          git worktree add ../assets origin/pr-assets
          mkdir -p ../assets/14c-lidar
          cp test-results/screenshots/*-lidar-*.png ../assets/14c-lidar/
          cd ../assets
          git add 14c-lidar
          git commit -m "Step 14c screenshots (${GITHUB_SHA::7})" || exit 0
          git push origin HEAD:pr-assets
