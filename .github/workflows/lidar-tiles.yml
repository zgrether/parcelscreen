name: Lidar terrain screenshot

# Roadmap step 14c: one screenshot of Lidar terrain over Mud Creek's red-gate line at zoom 17, with the live tiles
# (screenshots/lidar.spec.ts), for the PR's description. The cloud sessions that build the app can't reach the tile
# hosts; CI's runners can. The shot goes to the pr-assets branch (pr-assets/14c-lidar/). Nothing here gates a merge.
on:
  pull_request:
    paths:
      - components/Map/lidarStyle.ts
      - screenshots/lidar.spec.ts
      - .github/workflows/lidar-tiles.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A fork's PR gets a read-only token: nothing to push to.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm exec playwright test -c playwright.screenshots.config.ts screenshots/lidar.spec.ts
        env:
          E2E_SKIP_BUILD: "1"
      - name: To pr-assets/14c-lidar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin pr-assets
          git worktree add ../assets origin/pr-assets
          mkdir -p ../assets/14c-lidar
          cp test-results/screenshots/*-lidar-*.png ../assets/14c-lidar/
          cd ../assets
          git add 14c-lidar
          git commit -m "Step 14c screenshot (${GITHUB_SHA::7})" || exit 0
          git push origin HEAD:pr-assets
