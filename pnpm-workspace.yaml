allowBuilds:
  # resolver used by eslint-plugin-import; ships prebuilt binaries, its install script is not needed
  unrs-resolver: false
  # Serwist's service-worker build (step 17c): both ship prebuilt platform binaries as optional packages, so
  # their install scripts aren't needed (esbuild checked working without it)
  esbuild: false
  "@swc/core": false

# Turf, every package at one exact version (owner, 2026-10-08, Batch A A1; docs/plans/phase-0.md §4). @turf/turf
# declares its parts as ^7.x, so an exact pin on @turf/turf alone let them float: the port ran 7.4.0 parts
# behind a 7.1.0 front package. @turf/jsts is Turf's fork of JSTS (used by @turf/buffer) on its own 2.7.x line.
# CI checks the lockfile (`pnpm check:turf`, test/tools/turfPin.ts): add any new @turf package here.
